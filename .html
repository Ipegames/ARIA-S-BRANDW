```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Feliz Aniversário Ariane ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

height:100vh;

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;

background:
radial-gradient(
circle,
#ff90c6,
#ff418d
);

font-family:Arial;

}

/* FOTOS */

.orbita{

position:absolute;

width:800px;

height:800px;

animation:girar 30s linear infinite;

}

.foto{

position:absolute;

width:140px;

height:140px;

object-fit:cover;

border-radius:20px;

border:4px solid white;

box-shadow:
0 0 30px rgba(255,255,255,.8);

}

.f1{
top:10px;
left:330px;
}

.f2{
top:160px;
right:40px;
}

.f3{
bottom:160px;
right:40px;
}

.f4{
bottom:10px;
left:330px;
}

.f5{
bottom:160px;
left:40px;
}

.f6{
top:160px;
left:40px;
}

@keyframes girar{

from{
transform:rotate(0);
}

to{
transform:rotate(360deg);
}

}

/* CENTRO */

.cena{

position:relative;

width:500px;

height:500px;

}

/* TEXTO */

.texto{

position:absolute;

left:50%;

top:50%;

transform:
translate(-50%,-50%)
scale(.5);

opacity:0;

transition:1.2s;

font-size:58px;

font-weight:bold;

color:white;

text-align:center;

text-shadow:
0 0 25px white;

z-index:50;

}

.aberto .texto{

opacity:1;

transform:
translate(-50%,-50%)
scale(1);

}

/* CARTA */

.carta{

position:absolute;

left:50%;

top:50%;

transform:
translate(-50%,20px);

width:220px;

height:150px;

background:white;

border-radius:12px;

display:flex;

justify-content:center;

align-items:center;

font-size:65px;

transition:1.2s;

z-index:20;

}

.aberto .carta{

transform:
translate(-50%,-260px);

opacity:0;

}

/* ENVELOPE */

.envelope{

position:absolute;

left:50%;

top:50%;

transform:
translate(-50%,-50%);

width:420px;

height:320px;

display:flex;

justify-content:center;

align-items:center;

cursor:pointer;

z-index:999;

animation:
tremer .18s infinite;

transition:1s;

}

.aberto .envelope{

opacity:0;

transform:
translate(-50%,-50%)
scale(.5);

pointer-events:none;

}

@keyframes tremer{

0%{

transform:
translate(-50%,-50%)
rotate(-1deg);

}

50%{

transform:
translate(-49%,-50%)
rotate(1deg);

}

100%{

transform:
translate(-50%,-50%);

}

}

/* DESENHO */

.desenho{

position:relative;

width:260px;

height:180px;

}

.fundo{

position:absolute;

bottom:0;

width:100%;

height:120px;

background:#ffd6e4;

border-radius:12px;

}

.esquerda{

position:absolute;

left:0;

bottom:0;

width:0;

height:0;

border-top:60px solid transparent;

border-bottom:60px solid transparent;

border-left:130px solid #ffc2d6;

}

.direita{

position:absolute;

right:0;

bottom:0;

width:0;

height:0;

border-top:60px solid transparent;

border-bottom:60px solid transparent;

border-right:130px solid #ffb0cc;

}

.tampa{

position:absolute;

width:0;

height:0;

border-left:130px solid transparent;

border-right:130px solid transparent;

border-top:90px solid #ff96bd;

transition:1s;

transform-origin:top;

}

.aberto .tampa{

transform:
rotateX(180deg);

}

</style>

</head>

<body>

<div class="orbita">

<img src="https://drive.google.com/thumbnail?id=1Uu-n45IKHKnLh9ljs8ktGU1ic38zlfAr&sz=w1000" class="foto f1">

<img src="https://drive.google.com/thumbnail?id=1GMXDWDjIGQFhvy7tz_G9betcxb9sKIsu&sz=w1000" class="foto f2">

<img src="https://drive.google.com/thumbnail?id=1CLSRrSF5rkL7xV138AdtXlz3pHsbcWas&sz=w1000" class="foto f3">

<img src="https://drive.google.com/thumbnail?id=1rOTA_0dOQ2tGfbtU_q1fQHTFYe8Qdvyh&sz=w1000" class="foto f4">

<img src="https://drive.google.com/thumbnail?id=1ioWQvMzdf6gosXbDp-M4l_ZME5DbdcLU&sz=w1000" class="foto f5">

<img src="https://drive.google.com/thumbnail?id=1Uu-n45IKHKnLh9ljs8ktGU1ic38zlfAr&sz=w1000" class="foto f6">

</div>

<div class="cena" id="cena">

<div class="texto">

🎉<br>
FELIZ<br>
ANIVERSÁRIO<br>
ARIANE ❤️

</div>

<div class="carta">
💌
</div>

<div
class="envelope"
onclick="abrir()">

<div class="desenho">

<div class="tampa"></div>

<div class="esquerda"></div>

<div class="direita"></div>

<div class="fundo"></div>

</div>

</div>

</div>

<script>

function abrir(){

document
.getElementById(
"cena"
)
.classList
.add(
"aberto"
)

}

</script>

</body>
</html>
```
